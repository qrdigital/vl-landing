<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VentaLista - Tu Sistema de Pedidos</title>
    
    <!-- Meta tags para vista previa en WhatsApp -->
    <meta property="og:title" content="VentaLista - Tu Sistema de Pedidos">
    <meta property="og:description" content="Tus clientes no deberían preguntar. Deberían comprar. Un solo enlace para que tus clientes vean, elijan y pidan por WhatsApp.">
    <meta property="og:image" content="logoinformacion.jpg">
    <meta property="og:url" content="https://ventalista.lat/informacion">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b1510;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #0b1510;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            padding-bottom: 20px;
        }

        .section-block {
            position: relative;
            width: 100%;
            display: block;
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        .product-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Botón Ver Demo superpuesto en el banner de Demostración (donde indica la flecha) */
        .demo-container {
            position: relative;
            width: 100%;
        }

        .btn-ver-demo {
            position: absolute;
            top: 72%;
            right: 12%;
            transform: translateY(-50%);
            background-color: #25D366;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 10;
            text-decoration: none;
            line-height: 1.2;
        }

        .btn-ver-demo:hover {
            background-color: #1eb956;
            transform: translateY(-50%) scale(1.05);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 10px solid #ffffff;
        }

        /* Área de Pedido con el botón superpuesto al final */
        .pedido-container {
            position: relative;
            width: 100%;
            padding-bottom: 30px;
        }

        .btn-whatsapp-floating {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #25D366;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            width: 85%;
            max-width: 420px;
            z-index: 20;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-whatsapp-floating:hover {
            background-color: #1eb956;
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
        }

        .ws-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* Modal para reproducción de Video */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 500px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-content video {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            background: rgba(0,0,0,0.5);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        @media (max-width: 480px) {
            .btn-ver-demo {
                font-size: 13px;
                padding: 8px 14px;
            }
            .btn-whatsapp-floating {
                font-size: 16px;
                padding: 13px 20px;
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. Head (Con enlace a WhatsApp para acción inmediata) -->
        <div class="section-block">
            <a href="https://wa.me/51920832884?text=Hola,%20deseo%20solicitar%20mi%20VentaLista">
                <img class="product-img" src="headinformacion.jpg" alt="VentaLista - Head Encabezado">
            </a>
        </div>

        <!-- 2. Dolor -->
        <div class="section-block">
            <img class="product-img" src="dolorinformacion.jpg" alt="VentaLista - Problema / Dolor">
        </div>

        <!-- 3. Deseo -->
        <div class="section-block">
            <img class="product-img" src="deseoinformacion.jpg" alt="VentaLista - Deseo / Solución">
        </div>

        <!-- 4. Demostración (Boton Ver Demo posicionado en la mujer) -->
        <div class="section-block demo-container">
            <img class="product-img" src="demostracioninformacion.jpg" alt="VentaLista - Demostración del sistema">
            <button class="btn-ver-demo" onclick="openVideoModal()">
                <span class="play-icon"></span> Ver Demo
            </button>
        </div>

        <!-- 5. Pedido / Oferta con Botón WhatsApp montado encima -->
        <div class="section-block pedido-container">
            <img class="product-img" src="pedidoinformacion.jpg" alt="VentaLista - Oferta y Pedido">
            
            <a href="https://wa.me/51920832884?text=Hola,%20deseo%20solicitar%20mi%20VentaLista" class="btn-whatsapp-floating" target="_blank">
                <svg class="ws-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                </svg>
                Solicitar mi VentaLista
            </a>
        </div>

    </div>

    <!-- Modal para el Video -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeVideoModal()">&times;</span>
            <video id="demoVideo" controls>
                <source src="videoinformacion.mp4" type="video/mp4">
                Tu navegador no soporta el formato de video.
            </video>
        </div>
    </div>

    <script>
        function openVideoModal() {
            var modal = document.getElementById('videoModal');
            var video = document.getElementById('demoVideo');
            modal.style.display = 'flex';
            video.play();
        }

        function closeVideoModal() {
            var modal = document.getElementById('videoModal');
            var video = document.getElementById('demoVideo');
            video.pause();
            video.currentTime = 0;
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            var modal = document.getElementById('videoModal');
            if (event.target == modal) {
                closeVideoModal();
            }
        }
    </script>

</body>
</html>
